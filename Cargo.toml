[package]
name = "ensure-uniform-type"
version = "1.0.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
description = "Compile-time check that all fields of a struct share one type"
keywords = ["proc-macro", "repr-c", "struct", "compile-time", "uniform"]
categories = ["development-tools", "development-tools::ffi", "rust-patterns"]
repository = "https://github.com/sunsided/ensure-uniform-type-rs"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0", features = ["full"] }


[dev-dependencies]
proptest = "1"
trybuild = "1"

[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
